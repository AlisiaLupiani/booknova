<body>
   <div id="sezione-recensioni" class="container my-5">
    
    <div class="row justify-content-center">
        <div class="col-lg-9">
            
            <div class="d-flex align-items-center justify-content-between mb-4">
                <h2 class="section-title">Cosa ne pensano i lettori</h2>
                <div class="overall-rating">
                    <div>
                    <span class="stars" style="color: #ffc107; font-size: 1.5rem;"><[review_value]><[dynamic_stars]></span>
                   </div>
                    <div>
                    <span class="ms-2 fw-bold"><[book_title]></span>
                    </div>
                </div>
            </div>

            <hr class="linea-scura mb-5">

            <div class="reviews-wrapper">
                <!-- 1. Apriamo il ciclo usando il nome dell'array passato dal PHP -->
                <[foreach]>
                
                <div class="review-item pb-4 mb-4 border-bottom">
                    <div class="d-flex justify-content-between">
                        <div>
                            <!-- Chiusi correttamente i segnaposto di nome e cognome -->
                            <h5 class="mb-0 fw-bold"><[reviewer_name]> <[reviewer_surname]></h5>
                            
                            <!-- Rimosso il vecchio foreach interno: stampiamo direttamente il voto di questa recensione -->
                            <span class="text-warning">Voto: <[review_rating]>/5</span>
                        </div>
                        <span class="text-muted small"><[review_date]></span>
                    </div>
                    <div class="review-content mt-3">
                        <p><[review_comment]></p>
                    </div>
                </div>

                <!-- 2. Chiudiamo il ciclo -->
                <[/foreach]>
            </div>
        </div>
    </div>
</div>
</body>
