<body>
      <div class="review-container">
        <h1>Lascia una recensione su BookNova</h1>
        <form id="reviewSitoForm">
            <div class="form-group">
                <label for="userName">Il tuo Nome</label>
                <input type="text" id="userName" name="userName" value="<[user_name]>" placeholder="Mario Rossi" required>
            </div>
            
         
            
            <div class="form-group">
                <label for="comment">Recensione</label>
                <textarea id="comment" name="comment" rows="4" placeholder="Cosa ne pensi?" required></textarea>
            </div>
            
            <button type="submit" class="btn-submit">Invia Recensione</button>
        </form>
        <div id="review-message" class="review-msg"></div>

    </div>

<style>
.review-container {
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
}
</style>
</body>
