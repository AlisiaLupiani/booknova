<body>
    <div class="payment-container">
       <h1>Modifica il libro</h1>
<form id="editBookForm" method="POST" action="modifica_libro_process.php">
    
    <input type="hidden" id="bookId" name="bookId" value="<[book_id]>">

    <div class="form-group">
        <label for="bookTitle">Titolo</label>
        <input type="text" id="bookTitle" name="bookTitle" value="<[name]>" required>
    </div>
    
    <div class="form-group">
        <label for="bookAuthor">Autore</label>
        <input type="text" id="bookAuthor" name="bookAuthor" value="<[autore]>" required>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label for="bookPrice">Prezzo ($)</label>
            <input type="number" id="bookPrice" name="bookPrice" step="0.01" min="0" value="<[price]>" required>
        </div>

        <div class="form-group">
            <label for="publishYear">Anno Pubblicazione</label>
            <input type="number" id="publishYear" name="publishYear" min="1000" max="2026" value="<[anno_pubblicazione]>" required>
        </div>

         <div class="form-group">
            <label for="bookPublisher">Editore</label>
            <input type="text" id="bookPublisher" name="bookPublisher" value="<[editore]>" required>
        </div>
    </div>

    <div class="form-actions" style="margin-top: 20px; text-align: center;">
        <button type="submit" class="btn-action btn-edit" style="cursor: pointer; padding: 10px 20px;">Salva Modifiche</button>
    </div>
</form>
            
    </div>
           
   
    <style>
        .payment-container { max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        .btn-pay { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</body>
