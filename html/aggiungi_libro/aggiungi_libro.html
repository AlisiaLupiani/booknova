<style>
    .book-container { 
        max-width: 700px; /* Allargato leggermente per ospitare meglio le righe doppie */
        margin: 40px auto; 
        padding: 30px; 
        border: 1px solid #ccc; 
        border-radius: 12px; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9f9f9;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
    
    .form-group input, 
    .form-group select, 
    .form-group textarea { 
        width: 100%; 
        padding: 10px; 
        border: 1px solid #ccc; 
        border-radius: 5px; 
        box-sizing: border-box;
        font-size: 14px;
    }

    /* Stile specifico per la descrizione */
    .form-group textarea { resize: vertical; min-height: 80px; }
    
    .form-row { display: flex; gap: 20px; }
    .form-row .form-group { flex: 1; }
    
    .btn-submit { 
        width: 100%; 
        padding: 14px; 
        background-color: #79605f; 
        color: white; 
        border: none; 
        border-radius: 6px; 
        cursor: pointer; 
        font-size: 16px;
        font-weight: bold;
        transition: background 0.3s;
        margin-top: 10px;
    }
    
    .btn-submit:hover { background-color: #0056b3; }

    h2 { text-align: center; color: #222; margin-bottom: 25px; }
</style>

<div class="book-container">
    <h2>Gestione Catalogo Libri</h2>
    
    <form id="addBookForm" enctype="multipart/form-data">

         <div class="form-group">
    <label for="image">Immagine del Libro</label>
    <input type="file" id="image" name="image" accept="image/*" required>
</div>

        <div class="form-group">
            
            <label for="title">Titolo del Libro</label>
            <input type="text" id="title" name="title" placeholder="Inserisci il titolo..." required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="price">Prezzo (€)</label>
                <input type="number" id="price" name="price" step="0.01" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label for="condition">Condizione </label>
                <select id="condition" name="condition_id">
                      <[foreach]>
                    <option value="<[condition_id]>"><[condition_name]></option>
                   <[/foreach]>
                </select>
            </div>
        </div>
<div class="form-row">
    <div class="form-group">
        <label for="pages">Numero Pagine</label>
        <input type="number" id="pages" name="pages" placeholder="Es. 320" required>
    </div>

    <div class="form-group">
        <label for="year">Anno Pubblicazione</label>
        
        <input type="number" id="year" name="year" placeholder="Es. 2024" required>
    </div>
</div>

        <div class="form-group">
            <label for="description">Descrizione / Trama</label>
            <textarea id="description" name="description" placeholder="Breve riassunto del libro..."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="author">Autore</label>
                <select id="author" name="author_id">
                    <[foreach]>
                    <option value="<[author_id]>"><[author_name]></option>
                   <[/foreach]>
                   
                </select>
                </select>
            </div>
            <div class="form-group">
                <label for="publisher">Editore</label>
                <select id="publisher" name="publisher_id">
                 <[foreach]>
                    <option value="<[publisher_id]>"><[publisher_name]></option>
                   <[/foreach]>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Categoria</label>
                <select id="category" name="category_id">
                    <[foreach]>
                    <option value="<[category_id]>"><[category_name]></option>
                   <[/foreach]>
                </select>
            </div>
            <div class="form-group">
                <label for="format">Formato</label>
                <select id="format" name="format_id">
                     <[foreach]>
                    <option value="<[format_id]>"><[format_name]></option>
                   <[/foreach]>
                </select>
            </div>
        </div>

        <button type="submit" class="btn-submit">Salva Libro nel Database</button>
        
    </form>
</div>
