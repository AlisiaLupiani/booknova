<body>
    <div class="payment-container">
        <h1>Modifica Offerta Sconto</h1>
        
        <form id="editOfferForm" method="POST" action="modifica_offerta.php">
            
            <input type="hidden" id="offerId" name="offerId" value="<[offer_id]>">

            <div class="form-group">
                <label for="offerValue">Sconto (%)</label>
                <input type="number" id="offerValue" name="offerValue" min="0" max="100" step="0.01" value="<[valore_sconto]>" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="startDate">Data Inizio</label>
                    <input type="date" id="startDate" name="startDate" value="<[data_inizio]>" required>
                </div>

                <div class="form-group">
                    <label for="endDate">Data Fine</label>
                    <input type="date" id="endDate" name="endDate" value="<[data_fine]>" required>
                </div>
            </div>

           
            <div class="form-actions">
                <button type="submit" class="btn-action btn-edit">Salva Modifiche</button>
            </div>
            
            <p class="form-message"><[messaggio]></p>
        </form>
    </div>

    <style>
        .payment-container { max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, 
        .form-group select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        .form-actions { margin-top: 20px; text-align: center; }
        .btn-action { cursor: pointer; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; }
        /* Se nel foglio di stile globale non hai .btn-edit, eredita le proprietà base del vecchio bottone */
        .btn-edit { background-color: #007bff; color: white; width: auto; }
        .form-message { text-align: center; color: red; margin-top: 10px; }
    </style>
</body>
