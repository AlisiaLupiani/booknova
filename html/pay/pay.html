<body>
    <div class="payment-container">
        <h1>Pagina di Pagamento</h1>

        <form id="checkoutPaymentForm" method="post">
            <!-- Identificatori necessari -->
            <input type="hidden" name="checkout_payment" value="1">
            <input type="hidden" name="user_id" value="<[user_id]>">
            <input type="hidden" name="shipping_method_id" value="<[shipping_method_id]>">

            <!-- IMPORTANTE: invio dell'importo reale -->
            <input type="hidden" name="amount" value="<[amount]>">

            <div class="form-group">
                <label for="cardName">Titolare della Carta</label>
                <input type="text" id="cardName" name="cardName" required>
            </div>

            <div class="form-group">
                <label for="cardNumber">Numero Carta</label>
                <input type="text" id="cardNumber" name="cardNumber"
                       placeholder="1234 5678 9012 3456" maxlength="19" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="expiry">Data Scadenza</label>
                    <input type="text" id="expiry" name="expiry"
                           placeholder="MM/YY" maxlength="5" required>
                </div>

                <div class="form-group">
                    <label for="cvc">CVC</label>
                    <input type="text" id="cvc" name="cvc"
                           maxlength="4" required>
                </div>
            </div>

            <div class="form-group">
                <label for="amount_display">Importo</label>
                <input type="text" id="amount_display"
                       value="€ <[amount]>" readonly>
            </div>

            <button type="submit" class="btn-pay">Paga Ora</button>
        </form>
    </div>

    <style>
        .payment-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-group input[readonly] {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-pay {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>

    <script src="js/my_script.js"></script>
</body>
