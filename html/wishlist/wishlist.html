<body>

<section id="wishlist" class="bookshelf py-5 my-5">
    <div class="container">
        <div class="row">
            <div class="col-md-12">

                <!-- Intestazione -->
                <div class="section-header align-center">
                    <div class="title">
                        <span>Your saved items</span>
                    </div>
                    <h2 class="section-title">La Mia Lista dei Desideri 📚</h2>
                </div>

                <div class="tab-content">
                    <div id="all-genre" data-tab-content class="active">
                        <div class="row">

                            <!-- CICLO DEI LIBRI -->
                            <[foreach]>
                                <div class="col-md-3">
                                    <div class="product-item">

                                        <figure class="product-style">
                                            <!-- Immagine -->
                                            <img src="<[bookimageallgenre]>" 
                                                 alt="<[booktitleallgenre]>" 
                                                 class="product-item img-fluid">
                                        </figure>

                                        <figcaption>

                                            <!-- TITOLO -->
                                            <h3 style="margin-bottom:6px;">
                                                <a href="<[bookallgenrehrefid]>">
                                                    <[booktitleallgenre]>
                                                </a>
                                            </h3>

                                            
                                            <!-- Autore -->
                                            <span><[authorallgenre]></span>

                                            <!-- Prezzo -->
                                            <div class="item-price">$ <[priceallgenre]></div>
<button 
                                                type="button" 
                                                class="remove-from-wishlist" 
                                                data-book-id="<[bookidallgenre]>"
                                                style="
                                                   
                                                    border:none;
                                                    padding:3px 7px;
                                                    font-size:11px;
                                                    border-radius:4px;
                                                    margin-bottom:10px;
                                                    cursor:pointer;
                                                ">
                                                Remove ❤️
                                            </button>
                                        </figcaption>

                                    </div>
                                </div>
                            <[/foreach]>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

</body>
