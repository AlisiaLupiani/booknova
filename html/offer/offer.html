<body>

    <div class="container">
        <h2 class="section-title">Books with offer</h2>
        <div class="row">
            <div class="inner-content">
                <div class="product-list">
                    <div class="grid product-grid">
                        
                        <[foreach]>
                        <div class="product-item">
                            <figure class="product-style">
                                <img src="<[random_image_offer]>" alt="Books" class="product-item">
                                <button type="button" class="add-to-cart">Add to Cart</button>
                            </figure>
                            
                            <figcaption>
                                <a href="book_details.php?book_id=<[random_id_offer]>" class="btn">
                                    View Details
                                </a>
                                <h3><[random_title_offer]></h3>
                                <span><[random_author_offer]></span>
                                <div class="item-price">
                                    <span class="prev-price">$ <[random__price_offer]></span> $ <[random_discounted_price]>
                                </div>
                            </figcaption> 
                        </div>
                        <[/foreach]>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
