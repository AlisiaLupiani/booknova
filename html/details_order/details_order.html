<body>
    <div class="payment-container" style="max-width: 600px;">
        <h1>Dettaglio Ordine #<[ordine_id]></h1>
        
        <!-- Informazioni generali dell'ordine -->
        <div class="order-info" style="margin-bottom: 25px; background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #eee;">
            <p><strong>Utente:</strong> <[utente_email]></p>
            <p><strong>Data Ordine:</strong> <[data_ordine]></p>
            <p><strong>Totale:</strong> <[totale_ordine]> €</p>
        </div>

        <h3>Libri Ordinati</h3>
        
        <!-- Tabella ciclica basata sugli elementi dell'ordine -->
        <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
            <thead>
                <tr style="background-color: #f2f2f2; text-align: left;">
                    <th style="padding: 10px; border-bottom: 2px solid #ddd;">Titolo Libro</th>
                    <th style="padding: 10px; border-bottom: 2px solid #ddd; text-align: center;">Quantità</th>
                    <th style="padding: 10px; border-bottom: 2px solid #ddd; text-align: right;">Prezzo</th>
                </tr>
            </thead>
            <tbody>
                <[foreach]>
                <tr>
                    <td style="padding: 10px; border-bottom: 1px solid #ddd;"><[libro_titolo]></td>
                    <td style="padding: 10px; border-bottom: 1px solid #ddd; text-align: center;"><[libro_quantita]></td>
                    <td style="padding: 10px; border-bottom: 1px solid #ddd; text-align: right;"><[libro_prezzo]> €</td>
                </tr>
                <[/foreach]>
            </tbody>
        </table>

        <div class="form-actions" style="margin-top: 30px; text-align: center;">
            <a href="ordini_admin.php" class="btn-action btn-edit" style="text-decoration: none; display: inline-block;">Torna alla Lista Ordini</a>
        </div>
        
        <p style="text-align: center; color: red; margin-top: 10px;"><[messaggio]></p>
    </div>

    <style>
        .payment-container { max-width: 600px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif; }
        .order-info p { margin: 6px 0; font-size: 15px; }
        .btn-action { cursor: pointer; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; }
        .btn-edit { background-color: #007bff; color: white; }
    </style>
</body>
