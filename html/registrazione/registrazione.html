<body>
    <div class="registrazione-container">
        <h1>Registrati per la prima volta!</h1>
        
        <!-- Messaggio di status -->
        <div id="status-message" style="display:none; padding:12px; margin-bottom:15px; border-radius:4px; text-align:center;"></div>
        
        <!-- Form di registrazione -->
        <form id="registration-form" class="auth-form">
            <div class="form-group">
                <label for="email">Indirizzo Email</label>
                <input type="email" id="email" name="email" required>

            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">

    <style>
        .registrazione-container { max-width: 450px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }

            background-color: #aa5656; 
            color: white; 
            border: none;

            font-weight: bold;
            transition: background-color 0.3s;
