<body>
    <div class="recupero-container">
        <h1>Modifica Password</h1>
        
        <!-- Messaggio di status -->
        <div id="status-message" style="display:none; padding:12px; margin-bottom:15px; border-radius:4px; text-align:center;"></div>
        
        <!-- STEP 1: Email e nuova password -->
        <div id="step1">
            <form id="form-step1" class="auth-form">
                <div class="form-group">
                    <label for="email">Indirizzo Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="new-password">Nuova Password</label>
                    <input type="password" id="new-password" name="new_password" required minlength="6">
                    <small style="color:#999; display:block; margin-top:5px;">Minimo 6 caratteri</small>
                </div>
                
                <button type="submit" class="btn-pay">Modifica Password</button>
                <a href="login.php" style="display:block; text-align:center; margin-top:10px;">Torna al Login</a>
            </form>
        </div>
        
        <!-- STEP 2: Verifica vecchia password -->
        <div id="step2" style="display:none;">
            <div style="background-color:#fff3cd; border:1px solid #ffc107; padding:12px; margin-bottom:15px; border-radius:4px; color:#856404;">
                <strong>✓ Email verificata!</strong>
                <p style="margin:5px 0 0 0; font-size:14px;">Inserisci la tua vecchia password per confermare il cambio.</p>
            </div>
            
            <form id="form-step2" class="auth-form">
                <div class="form-group">
                    <label for="old-password">Vecchia Password</label>
                    <input type="password" id="old-password" name="old_password" required>
                </div>
                
                <button type="submit" class="btn-pay">Conferma Cambio Password</button>
                <button type="button" class="btn-back" onclick="window.resetPasswordForm()">Indietro</button>
            </form>
        </div>
    </div>

    <style>

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #aa5656; box-shadow: 0 0 5px rgba(170, 86, 86, 0.3); }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        .btn-pay { 
            width: 100%; 
            padding: 10px; 
            background-color: #aa5656; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-pay:hover { background-color: #8b4444; }
        .btn-pay:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-back {
            width: 100%;
            padding: 10px;
            background-color: #999;
            color: white;
            border: none;
            border-radius: 4px;

            margin-top: 10px;

        .btn-back:hover { background-color: #777; }

        }

            color: #721c24;
        }
