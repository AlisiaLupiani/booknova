<body>

	<section id="catalougue" class="bookshelf py-5 my-5">
		<div class="container">
			<div class="row">
				<div class="col-md-12">

					<div class="section-header align-center">
						<div class="title">
							<span>Our books</span>
						</div>
						<h2 class="section-title">Catalougues</h2>
					</div>

					<ul class="tabs">
						<li data-tab-target="#all-genre" class="active tab">All genres</li>

						<[foreach]>
							<li data-tab-target="#<[category]>" class="tab">
								<[categorylabel]>
							</li>
						<[/foreach]>
					</ul>

					<div class="tab-content">

						<div id="all-genre" data-tab-content class="active">
							<div class="row">

								<[foreach]>
									<div class="col-md-3">
										<div class="product-item">
											<figure class="product-style">
												<img src="<[bookimageallgenre]>" alt="<[booktitleallgenre]>" class="product-item">
												<button type="button" class="add-to-cart" data-product-tile="add-to-cart">
													Add to Cart
												</button>
											</figure>
											<figcaption>
												<h3><a href="<[bookallgenrehrefid]>"><[booktitleallgenre]></a></h3>
												<span><[authorallgenre]></span>
												<div class="item-price">$ <[priceallgenre]></div>
											</figcaption>
										</div>
									</div>
								<[/foreach]>

							</div>
						</div>

						<[foreach]>
							<div id="<[categorytab]>" data-tab-content>
								<div class="row">

									<[foreach]>
										<div class="col-md-3">
											<div class="product-item">
												<figure class="product-style">
													<img src="<[bookimagine]>" alt="<[booktitlecategory]>" class="product-item">
													<button type="button" class="add-to-cart" data-product-tile="add-to-cart">
														Add to Cart
													</button>
												</figure>
												<figcaption>
													<h3><a href="book_details.php"><[booktitlecategory]></a></h3>
													<span><[authorcategory]></span>
													<div class="item-price">$ <[pricecategory]></div>
												</figcaption>
											</div>
										</div>
									<[/foreach]>

								</div>
							</div>
						<[/foreach]>

					</div>

				</div>
			</div>
		</div>
	</section>

</body>
