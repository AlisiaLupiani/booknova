
<div id="header-wrap">
    <div class="container py-5">
        <div class="book-details-wrapper">
            
            <div class="book-cover-section">
                <img src="static/img/main-banner2.jpg" alt="Copertina libro" class="img-fluid main-book-img">
            </div>
            
            <div class="book-info-section">
                <h1 class="display-5 book-title"><[booktitle]></h1>
                <p class="book-author"><[author]></p>
               
                <div class="book-rating">
              
                    <a href="recensioni.php" class="stars-link">
                          <span class="stars">★★★★☆</span>
                          <span class="rating-text">(4.5/5) - Leggi le recensioni</span>
                           </a>
                            </div>  
                
                <div class="book-price"><[price]>$</div>
                
                <div class="book-description-box">
                    <h2 class="section-label"><Descrizione></h2>
                    <p><[description]></p>
                </div>
                
                <div class="book-specs">
                    <div class="spec-item"><strong>Editore:</strong> <[publisher]></div>
                    <div class="spec-item"><strong>Pagine:</strong> <[pages]></div>
                    <div class="spec-item"><strong>Anno:</strong> <[publication_year]></div>
                    <div class="spec-item"><strong>Condizione:</strong> <[condition]></div>
                     
                </div>
                
                <button class="btn-buy-now" id="add_to_cart_btn" data-btn-book-id="<[btnbookid]>">
                    Aggiungi al Carrello
                </button>
            </div>
        </div>      
    </div>
</div>
